.tabs{display:flex;gap:8px;margin:12px 0}

.msg.err{color:var(--err)}

<script>
const PEOPLE=["Rhian","Debora","Nico","Danielle","Nelsir"];
const BUFFETS=["Zaire","Sra Cozinha","Taise"];
const CRITS=[
 {id:"sabor",n:"Sabor",d:"Tempero, ponto da carne, sabor geral dos pratos"},
 {id:"apres",n:"Apresentação",d:"Visual dos pratos, montagem e capricho"},
 {id:"variedade",n:"Variedade do cardápio",d:"Opções, equilíbrio e criatividade do menu"},
 {id:"qualidade",n:"Qualidade e temperatura",d:"Frescor dos ingredientes, comida no ponto e na temperatura certa"}
];
const PREFIX="BUF2.";
let tab="A", me=null, buf=0, code="", msg="", msgErr=false;
let mine={};      // buffet(índice) -> {scores:{id:n}, comment}
let imported={};  // imported[buffet][pessoa] = {scores, comment}

const store={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(_){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}
};
const avg=s=>{const v=CRITS.map(c=>s&&s[c.id]).filter(x=>typeof x==="number");return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
const complete=s=>CRITS.every(c=>s&&typeof s[c.id]==="number");
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const f=x=>x==null?"–":x.toFixed(1).replace(".",",");
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function loadMine(){mine=(me&&store.get("buf2_mine_"+me))||{};}
function saveMine(){if(me)store.set("buf2_mine_"+me,mine);}
function draft(){if(!mine[buf])mine[buf]={scores:{},comment:""};return mine[buf];}

// ---- código (um por buffet) ----
function encode(){
  const d=mine[buf];
  const o={p:PEOPLE.indexOf(me),b:buf,s:CRITS.map(c=>d.scores[c.id]),c:d.comment||""};
  return PREFIX+btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decode(str){
  let b=str.slice(PREFIX.length).replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";
  const o=JSON.parse(decodeURIComponent(escape(atob(b))));
  if(!(o.p>=0&&o.p<PEOPLE.length)||!(o.b>=0&&o.b<BUFFETS.length)||!Array.isArray(o.s)||o.s.length!==CRITS.length)throw 0;
  const scores={};CRITS.forEach((c,j)=>{const v=Number(o.s[j]);if(!(v>=0&&v<=10))throw 0;scores[c.id]=v});
  return {person:PEOPLE[o.p],buffet:o.b,scores,comment:String(o.c||"").slice(0,500)};
}

// ---- telas ----
function render(){
  document.getElementById("tabA").className=tab==="A"?"on":"";
  document.getElementById("tabR").className=tab==="R"?"on":"";
  document.getElementById("view").innerHTML=tab==="A"?viewEval():viewResults();
  bind();
}
function setMsg(t,err){msg=t;msgErr=!!err;const m=document.getElementById("msg");if(m){m.textContent=t;m.className="msg"+(err?" err":"")}}

function viewEval(){
  let h=`<div class="card"><p class="lbl">Quem está avaliando?</p><div class="chips">`;
  PEOPLE.forEach(p=>{h+=`<button class="chip ${p===me?"on":""}" data-p="${p}">${p}</button>`});
  h+=`</div></div>`;
  if(!me)return h+`<p class="note" style="text-align:center">Escolha seu nome para começar.</p>`;
  h+=`<div class="card"><p class="lbl">Buffet</p><div class="chips">`;
  BUFFETS.forEach((b,i)=>{h+=`<button class="chip ${i===buf?"on":""}" data-b="${i}">${b}${complete((mine[i]||{}).scores)?'<span class="dot"></span>':""}</button>`});
  h+=`</div></div>`;
  const d=draft();
  h+=`<div class="card"><p class="lbl">${esc(me)} avaliando ${esc(BUFFETS[buf])}</p>`;
  CRITS.forEach(c=>{
    const v=d.scores[c.id];
    h+=`<div class="crit"><div class="top"><div><b>${c.n}</b><small>${c.d}</small></div><div class="val ${v==null?"empty":""}" id="v-${c.id}">${v==null?"–":f(v)}</div></div>
    <input type="range" min="0" max="10" step="0.5" value="${v==null?5:v}" data-c="${c.id}"></div>`;
  });
  h+=`<div class="avg"><span>Sua média para ${esc(BUFFETS[buf])}</span><strong id="mAvg">${f(avg(d.scores))}</strong></div>
  <p class="lbl" style="margin-top:14px">Comentário (opcional)</p>
  <textarea id="cm" placeholder="Pontos fortes, fracos, prato favorito...">${esc(d.comment)}</textarea>
  <p class="note">Suas notas ficam salvas neste aparelho enquanto você avalia.</p></div>`;
  h+=`<div class="card"><p class="lbl">Enviar notas do ${esc(BUFFETS[buf])}</p>
  <p class="note" style="margin:0 0 4px" id="stat">${statTxt()}</p>
  <button class="btn" id="gen" ${complete(d.scores)?"":"disabled"}>Gerar código do ${esc(BUFFETS[buf])}</button><div class="msg ${msgErr?"err":""}" id="msg">${msg}</div>`;
  if(code){
    h+=`<textarea class="code" id="codeBox" readonly>${code}</textarea>
    <button class="btn alt" id="copy">Copiar código</button>
    <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent("Minhas notas do buffet "+BUFFETS[buf]+" ("+me+"): "+code)}">Enviar por WhatsApp</a>`;
  }
  return h+`</div>`;
}
function statTxt(){
  return complete((mine[buf]||{}).scores)?"Tudo avaliado! Gere o código deste buffet e mande para quem está organizando.":"Dê uma nota em todos os critérios (mexa em cada controle) para gerar o código deste buffet.";
}
function refreshStatus(){
  const ok=complete((mine[buf]||{}).scores);
  const s=document.getElementById("stat");if(s)s.textContent=statTxt();
  const g=document.getElementById("gen");if(g)g.disabled=!ok;
  document.querySelectorAll("[data-b]").forEach(e=>{
    if(complete((mine[+e.dataset.b]||{}).scores)&&!e.querySelector(".dot"))e.insertAdjacentHTML("beforeend",'<span class="dot"></span>');
  });
}

function viewResults(){
  const R=(b,p)=>(imported[b]||{})[p];
  const bufAvgs=BUFFETS.map((_,b)=>mean(PEOPLE.map(p=>R(b,p)?avg(R(b,p).scores):null).filter(x=>x!=null)));
  const cnt=BUFFETS.map((_,b)=>PEOPLE.filter(p=>R(b,p)).length);
  let h=`<div class="card"><p class="lbl">Receber notas</p>
  <p class="note" style="margin:0 0 8px">Cole aqui os códigos que as pessoas enviaram (um por buffet). Pode colar vários de uma vez, mesmo com o texto da mensagem junto.</p>
  <textarea id="paste" placeholder="Cole os códigos aqui..."></textarea>
  <button class="btn" id="add">Adicionar notas</button><div class="msg ${msgErr?"err":""}" id="msg">${msg}</div>
  <p class="lbl" style="margin-top:12px">Já recebidas</p><div class="scroll"><table class="fit"><tr><th></th>${BUFFETS.map(b=>`<th>${esc(b)}</th>`).join("")}</tr>`;
  PEOPLE.forEach(p=>{
    h+=`<tr><td>${p}</td>`+BUFFETS.map((b,i)=>R(i,p)?`<td>✓ <button class="x" data-rm="${i}|${p}" title="remover">×</button></td>`:`<td style="color:var(--mut)">–</td>`).join("")+`</tr>`;
  });
  h+=`</table></div></div>`;
  if(!cnt.some(n=>n))return h;
  h+=`<div class="card"><p class="lbl">Média de cada pessoa por buffet</p><div class="scroll"><table class="fit"><tr><th></th>${BUFFETS.map(b=>`<th>${b}</th>`).join("")}</tr>`;
  PEOPLE.forEach(p=>{h+=`<tr><td>${p}</td>${BUFFETS.map((b,i)=>`<td>${R(i,p)?f(avg(R(i,p).scores)):"–"}</td>`).join("")}</tr>`});
  h+=`<tr class="final"><td>Média final</td>${bufAvgs.map(v=>`<td>${f(v)}</td>`).join("")}</tr></table></div></div>`;
  const rk=BUFFETS.map((b,i)=>i).filter(i=>cnt[i]).sort((a,b)=>bufAvgs[b]-bufAvgs[a]);
  h+=`<div class="card"><p class="lbl">Ranking geral</p>`;
  rk.forEach((i,k)=>{h+=`<div class="rank ${k===0?"first":""}"><div class="pos">${k+1}</div><div class="nm">${BUFFETS[i]}<small>${cnt[i]} ${cnt[i]===1?"avaliação":"avaliações"}</small></div><div class="sc">${f(bufAvgs[i])}</div></div>`});
  h+=`</div><div class="card"><p class="lbl">Média por critério</p><div class="scroll"><table class="fit"><tr><th></th>${BUFFETS.map(b=>`<th>${b}</th>`).join("")}</tr>`;
  CRITS.forEach(c=>{
    h+=`<tr><td>${c.n}</td>`+BUFFETS.map((b,i)=>f(mean(PEOPLE.filter(p=>R(i,p)).map(p=>R(i,p).scores[c.id]))) ).map(x=>`<td>${x}</td>`).join("")+`</tr>`;
  });
  h+=`</table></div></div>`;
  const cms=[];
  BUFFETS.forEach((b,i)=>PEOPLE.forEach(p=>{const r=R(i,p);if(r&&r.comment)cms.push(`<div class="cm"><b>${b} · ${p}:</b> ${esc(r.comment)}</div>`)}));
  if(cms.length)h+=`<div class="card"><p class="lbl">Comentários</p>${cms.join("")}</div>`;
  return h;
}

function bind(){
  document.querySelectorAll("[data-p]").forEach(e=>e.onclick=()=>{me=e.dataset.p;store.set("buf2_me",me);loadMine();code="";setMsg("");render()});
  document.querySelectorAll("[data-b]").forEach(e=>e.onclick=()=>{buf=+e.dataset.b;code="";setMsg("");render()});
  document.querySelectorAll("input[type=range]").forEach(e=>e.oninput=()=>{
    const id=e.dataset.c,d=draft();d.scores[id]=parseFloat(e.value);saveMine();code="";
    const v=document.getElementById("v-"+id);v.textContent=f(d.scores[id]);v.classList.remove("empty");
    document.getElementById("mAvg").textContent=f(avg(d.scores));
    refreshStatus();
  });
  const cm=document.getElementById("cm");if(cm)cm.oninput=()=>{draft().comment=cm.value;saveMine();code=""};
  const g=document.getElementById("gen");if(g)g.onclick=()=>{
    if(!complete((mine[buf]||{}).scores)){setMsg("Faltam notas em algum critério.",true);return}
    code=encode();setMsg("Pronto! Copie o código ou envie pelo WhatsApp.");render();
  };
  const cp=document.getElementById("copy");if(cp)cp.onclick=async()=>{
    try{await navigator.clipboard.writeText(code);setMsg("Código copiado!")}
    catch(_){const b=document.getElementById("codeBox");b.select();b.setSelectionRange(0,99999);setMsg("Selecionado. Use 'Copiar' do seu celular.")}
  };
  const ad=document.getElementById("add");if(ad)ad.onclick=()=>{
    const txt=document.getElementById("paste").value;
    const found=txt.match(/BUF2\.[A-Za-z0-9_-]+/g)||[];
    let ok=0,bad=0;
    found.forEach(c=>{try{const r=decode(c);(imported[r.buffet]=imported[r.buffet]||{})[r.person]={scores:r.scores,comment:r.comment};ok++}catch(_){bad++}});
    store.set("buf2_imp",imported);
    if(!found.length)setMsg("Nenhum código encontrado no texto.",true);
    else setMsg(ok+" recebido(s)"+(bad?` · ${bad} inválido(s)`:"")+".",bad>0&&!ok);
    render();
  };
  document.querySelectorAll("[data-rm]").forEach(e=>e.onclick=()=>{const [b,p]=e.dataset.rm.split("|");if(imported[b])delete imported[b][p];store.set("buf2_imp",imported);setMsg("");render()});
}

(function init(){
  const m=store.get("buf2_me");if(PEOPLE.includes(m))me=m;
  imported=store.get("buf2_imp")||{};
  loadMine();
  document.getElementById("tabA").onclick=()=>{tab="A";setMsg("");render()};
  document.getElementById("tabR").onclick=()=>{tab="R";setMsg("");render()};
  render();
})();
</script>
</body>
</html>
